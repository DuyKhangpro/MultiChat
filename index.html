<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}

button{cursor:pointer}

.msg.user{align-self:flex-end;background:var(--user);color:var(--userink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}

.box h2{margin:0 0 4px;font-size:20px}

.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.seg button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}
.key{display:block;margin-bottom:10px;font-size:13px;font-weight:600}
.key input{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:400}
.row{display:flex;gap:10px;align-items:center;margin-top:16px}
.row .grow{flex:1}
.row button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.row .pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#warn{color:#d9534f;display:none}

@media(min-width:761px){

<script>
/* ====== DANH SÁCH MODEL — thêm model mới ở đây, mỗi model là 1 chuỗi ID ====== */
const PROVIDERS = {
  chatgpt: { name: "ChatGPT", color: "#10a37f", models: [ "gpt-6-luna","gpt-6.1-terra", "gpt-6.1-sol", "gpt-6-astra", "gpt-6-sol", "gpt-5.6-sol","gpt-5.6-terra","gpt-5.6-luna", "gpt-5.5-pro-2026-04-23", "gpt-5.2-pro-2025-12-11", "gpt-5.2-2025-12-11", "gpt-5.4-mini-2026-03-17", "gpt-5.4-pro-2026-03-05", "gpt-5.5-2026-04-23", "gpt-5", "gpt-5-mini", "gpt-5-nano", "gpt-4.1", "gpt-4o", "o4-mini"] },
  claude:  { name: "Claude",  color: "#c96442", models: [ "claude-fable-5-2", "claude-fable-5-1", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-sonnet-4-6"] },
  gemini:  { name: "Gemini",  color: "#4285f4", models: [ "gemini-4-neon", "gemini-4-carbon", "gemini-4-argon", "gemini-4-hydrogen", "gemini-3.8-flash", "gemini-3.6-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-3-flash-preview"] },
  grok:    { name: "Grok",    color: "#555a66", models: [ "grok-4.7", "grok-4.6", "grok-4.5", "grok-4.3", "grok-4.20"] },
  groq:    { name: "Groq",    color: "#f55036", models: [ "openai/gpt-oss-safeguard-20b", "meta-llama/llama-prompt-guard-2-86m", "meta-llama/llama-prompt-guard-2-22m", "qwen/qwen3.8-27b", "llama-3.3-70b-versatile", "llama-3.1-8b-instant", "openai/gpt-oss-120b", "openai/gpt-oss-20b", "meta-llama/llama-4-scout-17b-16e-instruct", "qwen/qwen3-32b", "moonshotai/kimi-k2-instruct"] },
  openrouter: { name: "OpenRouter", color: "#6467f2", models: [ "openrouter/auto", "google/gemini-4-carbon", "openai/gpt-6.1-sol-pro", "anthropic/claude-fable-5.2", "anthropic/claude-fable-5.2:batch", "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free", "nvidia/nemotron-3-ultra-550b-a55b:free", "nvidia/nemotron-3.5-super-vl:free", "nvidia/nemotron-3.5-embed-8b:free", "nvidia/nemotron-3.5-embed-1b:free", "openai/gpt-5", "openai/gpt-5-mini", "anthropic/claude-sonnet-4.5", "anthropic/claude-opus-4.1", "google/gemini-2.5-pro", "google/gemini-2.5-flash", "x-ai/grok-4", "deepseek/deepseek-chat-v3.1", "deepseek/deepseek-r1", "meta-llama/llama-3.3-70b-instruct", "qwen/qwen3-235b-a22b", "moonshotai/kimi-k2", "mistralai/mistral-large", "openai/gpt-oss-120b", "openai/gpt-oss-20b:free", "meta-llama/llama-3.3-70b-instruct:free"] }
};
/* ============================================================================= */

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
store.ok = (() => { try { localStorage.setItem("mc_t", "1"); localStorage.removeItem("mc_t"); return true; } catch(e){ return false; } })();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
/* Custom Providers: lưu trong localStorage (không kèm API key, key nằm trong kho mã hóa) */
let customs = store.get("mc_custom", []); if (!Array.isArray(customs)) customs = [];
const CPAL = ["#e0a100", "#d6409f", "#0ea5a5", "#8b5cf6", "#ef4444", "#22a06b", "#f97316", "#3b82f6"];
const regCustom = c => { PROVIDERS[c.id] = { name: c.name, color: c.color, models: c.models, custom: true, fmt: c.fmt, url: c.url }; };
customs = customs.filter(c => c && c.id && c.name && c.url && Array.isArray(c.models) && c.models.length && !PROVIDERS[c.id]);
customs.forEach(regCustom);
let ids = Object.keys(PROVIDERS), ALL = [...ids, "team", "group"];
const refreshIds = () => { ids = Object.keys(PROVIDERS); ALL = [...ids, "team", "group"]; ALL.forEach(i => { if (!Array.isArray(S.convs[i])) S.convs[i] = []; }); };
const S = {
  p: store.get("mc_p", "chatgpt"),
  model: store.get("mc_model", {}),
  convs: store.get("mc_convs", {}),
  cur: store.get("mc_cur", {}),
  keys: {},
  theme: store.get("mc_theme", "light"),
  eff: store.get("mc_eff", "auto"),
  search: store.get("mc_search", false),
  slides: store.get("mc_slides", false),
  ui: store.get("mc_ui", "new"),
  pending: [],
  vaultErr: false,
  busy: false
};
if (!PROVIDERS[S.p] && !isMulti(S.p)) S.p = ids[0];
S.team = store.get("mc_team", null) || {};
S.chat = { notify: false, auto: false, n: 3, tmax: 12, saver: false, ...store.get("mc_chat", {}) };
if (!Number.isInteger(S.chat.tmax) || S.chat.tmax < 2 || S.chat.tmax > 100) S.chat.tmax = 12;
if (!Number.isInteger(S.chat.n) || S.chat.n < 1 || S.chat.n > 20) S.chat.n = 3;
S.lang = store.get("mc_lang", "en"); if (S.lang !== "en" && S.lang !== "vi") S.lang = "en";
const KS = { team: ["a", "b"], group: ["a", "b", "c", "d"] };      /* Team = 2 AI, Group = 4 AI */
function isMulti(p){ return p === "team" || p === "group"; }
S.group = store.get("mc_group", null) || {};
function fixTeam(){
  ["team", "group"].forEach(kind => {
    const P = S[kind] = S[kind] || {};
    KS[kind].forEach((k, n) => {
      const T = P[k] = P[k] || {};
      if (!PROVIDERS[T.p]) T.p = ids[(n + 1) % ids.length];
      if (!PROVIDERS[T.p].models.includes(T.m)) T.m = PROVIDERS[T.p].models[0];
    });
  });
}
fixTeam();

/* ====== Ngôn ngữ / Language: thêm hoặc sửa chữ ở đây ====== */
const I18N = {
  en: {
    convs: "Conversations", settings: "Settings", togAria: "Collapse or expand the sidebar", togCollapse: "Collapse sidebar", togExpand: "Expand sidebar", menuT: "Collapse / open sidebar",
    newcT: "New conversation", pickModel: "Choose model", attachT: "Attach files or images (up to 8)", attach: "📎 Upload file", search: "🌐 Search",
    mFile: "Upload file", mSearch: "Web search", mSlides: "PowerPoint slides", plusT: "More options", slidesT: "The AI makes PowerPoint slides you can preview and download", slidesPill: "📊 Slides",
    effT: "AI reasoning level. Models that don't support it ignore it or return an error from the provider.",
    ph: "Type a message… (Enter to send, Shift+Enter for a new line, paste or drop files)", send: "Send", stop: "Stop",
    tabsAria: "Settings sections", hColor: "Color mode", light: "Light", dark: "Dark", hUI: "UI mode",
    uiHint: "Classic: the original look, no animations. New: a modern look with animations.", hLang: "Language",
    keysHint: "Keys are encrypted with AES-GCM before being stored in the browser and saved as you type, so F5 won't lose them. This is browser-side encryption; it doesn't replace keeping your device and browser secure.",
    warn: "The browser is blocking storage or encryption, so keys will be lost on F5. Open the file directly in Chrome, Edge or Firefox (not in a preview window).",
    showKeys: "Show API keys", close: "Close", apply: "Apply",
    hNotif: "Notifications", notifT: "Notify when the AI finishes replying", notifS: "Only shown when you're on another tab or window. Requires notification permission from the browser.",
    notiWarn: "The browser didn't grant notification permission. Allow notifications for this page in your browser settings. If you opened the file directly (file://), Chrome usually blocks notifications; run it through a local server such as http://localhost instead.",
    hAuto: "Auto-switch model", autoT: "Switch to the next model when a model keeps failing", autoS: "Same AI, moves down to the next model in its list. Off by default.", autoN: "Consecutive errors before switching",
    hTeam: "Team", tmaxT: "Turn limit", tmaxS: "Maximum number of alternating messages between the two AIs per request. Default 12. Group mode is locked at 48.",

/* ====== Mã hóa API key: AES-GCM 256, khóa không-xuất-được lưu trong IndexedDB ====== */
const Vault = {
  async key(){
    if (this.k) return this.k;
    const db = await new Promise((res, rej) => { const r = indexedDB.open("mc_vault", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    let k = await new Promise((res, rej) => { const q = db.transaction("k").objectStore("k").get("main"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    if (!k){
      k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      await new Promise((res, rej) => { const tx = db.transaction("k", "readwrite"); tx.objectStore("k").put(k, "main"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    }
    return this.k = k;
  },
  async enc(obj){
    const k = await this.key(), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj))));
    const b = new Uint8Array(12 + ct.length); b.set(iv); b.set(ct, 12);
    return btoa(String.fromCharCode(...b));
  },
  async dec(s){
    const k = await this.key(), b = Uint8Array.from(atob(s), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, k, b.slice(12))));
  }
};
let kq = Promise.resolve();
function saveKeys(){
  const snap = { ...S.keys };
  kq = kq.then(async () => {
    try { if (!store.set("mc_keys_enc", await Vault.enc(snap))) throw 0; try { localStorage.removeItem("mc_keys"); } catch(e){} S.vaultErr = false; return true; }
    catch(e){ S.vaultErr = true; return false; }
  });
  return kq;
}
async function loadKeys(){
  try {
    const e = store.get("mc_keys_enc", null);
    if (e) S.keys = await Vault.dec(e);
    else { const o = store.get("mc_keys", null); if (o){ S.keys = o; await saveKeys(); } }
  } catch(e){ S.keys = {}; if (store.get("mc_keys_enc", null)) toast(t("decErr")); else S.vaultErr = true; }
}

  /* đầy bộ nhớ: lưu bản không kèm ảnh và phần suy nghĩ */

  store.set("mc_convs", lite);
}

function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function md(t){
  t = esc(t);
  t = t.replace(/```\w*\n?([\s\S]*?)```/g, (_, c) => "<pre><code>" + c.replace(/\n$/,"") + "</code></pre>");
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(?<!["'>=])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return t.replace(/\n/g, "<br>").replace(/(<pre><code>[\s\S]*?<\/code><\/pre>)/g, m => m.replace(/<br>/g, "\n"));
}
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2200); }

function setTheme(t){
  S.theme = t; document.documentElement.dataset.theme = t; store.set("mc_theme", t);
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
}

  b.disabled = !sup; b.classList.toggle("on", S.search && sup);

  if (ext === "docx" || ext === "pptx" || ext === "xlsx"){
    try { return { name, size, kind: "text", text: cut(await officeText(await f.arrayBuffer(), ext)) }; } catch(e){ return { name, size, kind: "bin" }; }
  }
  if (f.type.startsWith("text/") || TEXT_EXT.test(name) || /^(dockerfile|makefile|readme|license)$/i.test(name) || /json|xml|javascript|csv/.test(f.type)) return { name, size, kind: "text", text: cut(await f.text()) };
  const buf = await f.arrayBuffer(), sample = new TextDecoder("utf-8").decode(buf.slice(0, 200000));      /* thử đoán: nếu giống văn bản thì đọc như văn bản */
  const bad = (sample.match(/\uFFFD|\u0000/g) || []).length;
  if (bad / Math.max(1, sample.length) < 0.01) return { name, size, kind: "text", text: cut(new TextDecoder().decode(buf)) };
  return { name, size, kind: "bin" };
}

/* ====== Gọi API ====== */
const BASE = { chatgpt: "https://api.openai.com/v1", grok: "https://api.x.ai/v1", groq: "https://api.groq.com/openai/v1", openrouter: "https://openrouter.ai/api/v1" };
const canPdf = p => ["claude", "gemini"].includes(fmtOf(p)) || p === "chatgpt" || p === "openrouter";      /* AI đọc được PDF gửi kèm trực tiếp */
const msgTxt = (m, p) => {        /* nội dung chữ của tin nhắn, kèm các tệp văn bản đính kèm */
  let s = m.content || "";
  (m.files || []).forEach(f => {
    if (f.kind === "text") s += "\n\n<file name=\"" + f.name + "\">\n" + f.text + "\n</file>";
    else if (f.kind === "pdf" && canPdf(p)) return;
    else s += "\n\n[Attached file: " + f.name + " (" + fmtSize(f.size || 0) + ") - " + (f.kind === "pdf" ? "this AI cannot read PDF files" : "its content could not be read") + "]";
  });
  (m.fmeta || []).forEach(f => { s += "\n\n[Attached file: " + f.name + " - content no longer available]"; });
  return s;
};
const pdfsOf = (m, p) => canPdf(p) ? (m.files || []).filter(f => f.kind === "pdf") : [];
const toOAI = (m, p) => {
  const tx = msgTxt(m, p), im = m.imgs || [], pf = pdfsOf(m, p);
  return (!im.length && !pf.length) ? { role: m.role, content: tx } : { role: m.role, content: [...(tx ? [{ type: "text", text: tx }] : []), ...im.map(i => ({ type: "image_url", image_url: { url: du(i) } })), ...pf.map(f => ({ type: "file", file: { filename: f.name, file_data: "data:application/pdf;base64," + f.d } }))] };
};
const toResp = (m, p) => {
  const tx = msgTxt(m, p), im = m.imgs || [], pf = pdfsOf(m, p);
  return (!im.length && !pf.length) ? { role: m.role, content: tx } : { role: m.role, content: [...(tx ? [{ type: "input_text", text: tx }] : []), ...im.map(i => ({ type: "input_image", image_url: du(i) })), ...pf.map(f => ({ type: "input_file", filename: f.name, file_data: "data:application/pdf;base64," + f.d }))] };
};
const toClaude = (m, p) => {
  const tx = msgTxt(m, p), im = m.imgs || [], pf = pdfsOf(m, p);
  return (!im.length && !pf.length) ? { role: m.role, content: tx } : { role: m.role, content: [...im.map(i => ({ type: "image", source: { type: "base64", media_type: i.m, data: i.d } })), ...pf.map(f => ({ type: "document", title: f.name, source: { type: "base64", media_type: "application/pdf", data: f.d } })), ...(tx ? [{ type: "text", text: tx }] : [])] };
};

/* giới hạn lượt của Team: S.chat.tmax (chọn trong Cài đặt > Chat) */
const DONE = /(đã|da)\s*xong/i;

const fmtOf = p => PROVIDERS[p].custom ? PROVIDERS[p].fmt : (p === "claude" ? "claude" : p === "gemini" ? "gemini" : "openai");
const trimU = u => u.trim().replace(/\/+$/, "");
const chatUrl = p => { if (!PROVIDERS[p].custom) return BASE[p] + "/chat/completions"; const u = trimU(PROVIDERS[p].url); return /\/chat\/completions$/.test(u) ? u : u + "/chat/completions"; };
const claudeUrl = p => { if (!PROVIDERS[p].custom) return "https://api.anthropic.com/v1/messages"; const u = trimU(PROVIDERS[p].url); return /\/messages$/.test(u) ? u : /\/v1$/.test(u) ? u + "/messages" : u + "/v1/messages"; };
const geminiUrl = (p, m) => { const u = PROVIDERS[p].custom ? trimU(PROVIDERS[p].url).replace(/\/models$/, "") : "https://generativelanguage.googleapis.com/v1beta"; return u + "/models/" + encodeURIComponent(m) + ":streamGenerateContent?alt=sse"; };
const xhEff = m => /^gpt-(5\.([2-9]|\d\d)|[6-9])/.test(m) ? "xhigh" : "high";   /* Extra High: model cũ không có xhigh thì dùng high */

async function readSSE(res, fn){
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;){
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0){
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
      if (!data || data === "[DONE]") continue;
      let j; try { j = JSON.parse(data); } catch(e){ continue; }
      fn(j);
    }
  }
}
function splitThink(raw){      /* một số model (qwen, deepseek…) trả suy nghĩ trong thẻ <think> */
  const m = raw.match(/<think>([\s\S]*?)(<\/think>|$)/);
  return m ? { think: m[1], text: raw.replace(m[0], "").replace(/^\s+/, "") } : { think: "", text: raw };
}

/* Gọi API dạng stream. on(text, think) được gọi liên tục khi có chữ mới. */
async function callAPI(o){
  const { p, model, key, eff, search, sys, signal, on } = o, ms = o.msgs.filter(m => !m.err);
  const headers = { "Content-Type": "application/json" };
  const f = fmtOf(p), XH = eff === "xhigh";
  let url, body, ev, fb = null, raw = "", rs = "", aborted = false;
  const src = [], addSrc = (u, t) => { if (u && !src.some(s => s.u === u)) src.push({ u, t: t || u }); };
  const emit = () => { const s = splitThink(raw); on(s.text, (rs + s.think).trim()); };
  const T = d => { raw += d; emit(); }, R = d => { rs += d; emit(); };
  if (f === "openai"){
    if (key) headers.Authorization = "Bearer " + key;
    if (search && (p === "chatgpt" || p === "grok")){            /* ChatGPT & Grok: Responses API + web_search */
      url = BASE[p] + "/responses";
      body = { model, input: ms.map(m => toResp(m, p)), tools: [{ type: "web_search" }], stream: true };
      if (sys) body.instructions = sys;
      if (eff !== "auto" && p === "chatgpt" && REASON.test(model)) body.reasoning = { effort: XH ? xhEff(model) : eff };
      fb = j => j.output_text || (j.output || []).filter(x => x.type === "message").flatMap(x => x.content || []).map(c => c.text || "").join("");
      ev = j => {
        const ty = j.type || "";
        if (ty === "response.output_text.delta") T(j.delta);
        else if (/reasoning(_summary)?_text\.delta$/.test(ty)) R(j.delta);
        else if (ty === "response.output_text.annotation.added" && j.annotation && j.annotation.url) addSrc(j.annotation.url, j.annotation.title);
        else if (ty === "error") throw new Error(j.message || (j.error && j.error.message) || t("err"));
        else if (ty === "response.failed") throw new Error((j.response && j.response.error && j.response.error.message) || t("failed"));
      };
    } else {
      url = chatUrl(p);
      body = { model, messages: [...(sys ? [{ role: "system", content: sys }] : []), ...ms.map(m => toOAI(m, p))], stream: true };
      if (eff !== "auto"){
        if (p === "chatgpt" && REASON.test(model)) body.reasoning_effort = XH ? xhEff(model) : eff;
        if (p === "grok" && /grok-3-mini/.test(model)) body.reasoning_effort = (eff === "high" || XH) ? "high" : "low";
        if (p === "groq" && /gpt-oss/.test(model)) body.reasoning_effort = XH ? "high" : eff;
        if (p === "openrouter") body.reasoning = { effort: eff };
      }
      if (search && p === "groq" && /gpt-oss/.test(model)) body.tools = [{ type: "browser_search" }];
      if (search && p === "openrouter") body.plugins = [{ id: "web" }];
      fb = j => (j.choices[0].message.content || "");
      ev = j => {
        if (j.error) throw new Error(j.error.message || t("err"));
        const c = j.choices && j.choices[0]; if (!c) return;
        const d = c.delta || {}, rr = d.reasoning_content || (typeof d.reasoning === "string" ? d.reasoning : "");
        if (rr) R(rr);
        if (d.content) T(d.content);
        (d.annotations || []).forEach(a => a.url_citation && addSrc(a.url_citation.url, a.url_citation.title));
      };
    }
  } else if (f === "claude"){
    url = claudeUrl(p);
    if (key) headers["x-api-key"] = key; headers["anthropic-version"] = "2023-06-01"; headers["anthropic-dangerous-direct-browser-access"] = "true";
    const bud = { low: 1024, medium: 4096, high: 12000, xhigh: 24000 }[eff];
    body = { model, max_tokens: (bud || 0) + 4096, messages: ms.map(m => toClaude(m, p)), stream: true };
    if (sys) body.system = sys;
    if (bud) body.thinking = { type: "enabled", budget_tokens: bud };
    if (search) body.tools = [{ type: "web_search_20250305", name: "web_search", max_uses: 5 }];
    ev = j => {
      if (j.type === "content_block_delta"){ const d = j.delta || {}; if (d.type === "text_delta") T(d.text); else if (d.type === "thinking_delta") R(d.thinking); }
      else if (j.type === "content_block_start" && j.content_block && Array.isArray(j.content_block.content)) j.content_block.content.forEach(x => x.url && addSrc(x.url, x.title));
      else if (j.type === "error") throw new Error((j.error && j.error.message) || t("err"));
    };
  } else {
    url = geminiUrl(p, model);
    if (key) headers["x-goog-api-key"] = key;
    body = { contents: ms.map(m => { const tx = msgTxt(m, p); return { role: m.role === "user" ? "user" : "model", parts: [...(m.imgs || []).map(i => ({ inline_data: { mime_type: i.m, data: i.d } })), ...pdfsOf(m, p).map(f => ({ inline_data: { mime_type: "application/pdf", data: f.d } })), ...(tx ? [{ text: tx }] : [])] }; }) };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };
    const tc = {};
    if (/gemini-(2\.5|3|4)/.test(model)) tc.includeThoughts = true;
    if (eff !== "auto"){
      if (/gemini-(3|4)/.test(model)) tc.thinkingLevel = (XH || (/pro/.test(model) && eff === "medium")) ? "high" : eff;
      else if (/gemini-2\.5/.test(model)) tc.thinkingBudget = { low: 1024, medium: 8192, high: 24576, xhigh: /pro/.test(model) ? 32768 : 24576 }[eff];
    }
    if (Object.keys(tc).length) body.generationConfig = { thinkingConfig: tc };
    if (search) body.tools = [{ google_search: {} }];
    ev = j => {
      if (j.error) throw new Error(j.error.message || t("err"));
      const c = j.candidates && j.candidates[0]; if (!c) return;
      ((c.content && c.content.parts) || []).forEach(x => { if (x.text) (x.thought ? R(x.text) : T(x.text)); });
      ((c.groundingMetadata || {}).groundingChunks || []).forEach(x => x.web && addSrc(x.web.uri, x.web.title));
    };
  }
  const go = () => fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal });
  const fail = async r => { const j = await r.json().catch(() => ({})), e = Array.isArray(j) ? j[0] : j; return new Error((e && e.error && (e.error.message || e.error)) || (t("err") + " " + r.status)); };
  try {
    let r = await go();
    if (!r.ok){
      const er = await fail(r);
      if (!fb || !/stream/i.test(er.message)) throw er;          /* model không cho stream: chuyển sang không-stream */
      delete body.stream; r = await go();
      if (!r.ok) throw await fail(r);
      T(fb(await r.json()));
    } else await readSSE(r, ev);
  } catch(e){ if (e.name === "AbortError") aborted = true; else throw e; }
  const s = splitThink(raw);
  let text = s.text;
  if (src.length) text += "\n\n**" + t("sources") + "**\n" + src.map(x => "- " + x.t + ": " + x.u).join("\n");
  return { text, think: (rs + s.think).trim(), aborted };
}

const AUTO_HOPS = 3;                       /* tự đổi: tối đa bấy nhiêu model cho mỗi yêu cầu */
const FATAL = /incorrect api key|invalid.{0,12}api.?key|api key not valid|unauthori[sz]ed|authentication/i;
const sleep = (ms, sig) => new Promise(res => { const t = setTimeout(res, ms); if (sig) sig.addEventListener("abort", () => { clearTimeout(t); res(); }, { once: true }); });
/* Chế độ tiết kiệm token: chỉ dẫn ẩn (system prompt) gửi kèm mỗi yêu cầu khi bật */
const SAVER = "Token-saving mode is ON. Think only as much as needed and keep your reasoning brief. Answer as concisely as possible: no preamble, no restating the question, no repetition, no unnecessary caveats. Do not cut content the user explicitly asked for (code, documents, requested details); just avoid padding. Reply in the user's language.";

/* Chế độ slide PowerPoint: chỉ dẫn ẩn để AI trả về khối ```pptx (JSON), app sẽ xem trước và tạo file .pptx */
const SLIDES = "PowerPoint mode is ON. If the user asks for a presentation, slides or a PowerPoint, reply with exactly ONE code block fenced as ```pptx containing only valid JSON (double quotes, no comments, no trailing commas); the app turns it into a downloadable .pptx file with a preview. Shape:\n" +
  '{"title":"Deck title","author":"optional","theme":{"bg":"FFFFFF","text":"1F2937","accent":"5B5EF4","font":"Calibri"},"slides":[\n' +
  ' {"type":"title","title":"…","subtitle":"…"},\n' +
  ' {"title":"…","bullets":["point",{"text":"sub-point","level":1}],"notes":"speaker notes"},\n' +
  ' {"title":"…","text":"short paragraph"},\n' +
  ' {"title":"…","columns":[{"heading":"A","bullets":["…"]},{"heading":"B","bullets":["…"]}]},\n' +
  ' {"title":"…","table":{"header":["Col 1","Col 2"],"rows":[["a","b"]]}},\n' +
  ' {"title":"…","chart":{"type":"bar","labels":["Q1","Q2"],"series":[{"name":"Sales","values":[10,20]}]}},\n' +
  ' {"title":"…","image":{"url":"https://… or data:image/…"},"caption":"…"}\n]}\n' +
  "Rules: colors are 6-digit hex without #; chart type is bar, line or pie; keep text short (max 6 bullets per slide, 5-12 slides unless asked otherwise); only use image URLs the user gave you; write in the user's language; add at most one short sentence before the block and a brief note after it; do not write python-pptx or other code for slides.";

/* Một lượt trả lời: hiện bong bóng, đếm giờ, hiện phần suy nghĩ; nếu bật "Tự đổi model" thì thử lại rồi đổi sang model kế bên khi lỗi */
async function turn(o){
  const { p, msgs, label, color, ctl } = o, cfg = S.chat, list = PROVIDERS[p].models, N = cfg.auto ? cfg.n : 1;
  const sys = [o.sys, cfg.saver ? SAVER : "", S.slides ? SLIDES : ""].filter(Boolean).join("\n\n");
  let model = o.model; const b = botBubble(label, color, "", true);
  let t0 = performance.now(), ttft = null, info = "";
  const tick = setInterval(() => b.meta("⏱ " + fmtT(performance.now() - t0) + (ttft == null ? t("waiting") : "") + info), 100);
  let r, err, tries = 0, hops = 0;
  for (;;){
    err = null; t0 = performance.now(); ttft = null;
    try {
      r = await callAPI({ p, model, msgs, key: S.keys[p], eff: S.eff, search: S.search && canSearch(p, model), sys, signal: ctl.signal,
        on: (tx, th) => { if (ttft == null && (tx || th)) ttft = performance.now() - t0; b.set(tx, th); } });
    } catch(e){ err = e; }
    if (!err || ctl.signal.aborted || !cfg.auto || FATAL.test(String(err.message))) break;
    tries++; b.set("", "");
    if (tries < N){ info = t("retry", tries, N); await sleep(800 * tries, ctl.signal); continue; }
    if (hops >= AUTO_HOPS || list.length < 2) break;
    model = list[(list.indexOf(model) + 1) % list.length]; hops++; tries = 0;
    info = t("switching", model);
  }
  clearInterval(tick);
  const m = { role: "assistant", content: "", ms: Math.round(performance.now() - t0), ttft: ttft == null ? null : Math.round(ttft) };
  if (err){
    m.err = true; m.content = t("errPrefix") + (err.message === "Failed to fetch" ? t("netErr") : String(err.message));
    if (cfg.auto && (hops > 0 || tries > 1)) m.content += "\n\n" + t("retried", hops > 0);
    b.el.classList.add("err");
  } else {
    m.content = r.text || (r.aborted ? "" : t("emptyReply"));
    if (r.think) m.think = r.think;
    if (r.aborted){ m.aborted = true; m.content = (m.content ? m.content + "\n\n" : "") + t("stopped"); }
    if (model !== o.model){
      m.sw = o.model + " → " + model;
      if (o.onSwitch) o.onSwitch(model);
      toast(t("switched", m.sw));
    }
  }
  b.flush(m.content, m.think); b.meta(metaText(m));
  return m;
}

/* ====== Team (2 AI) & Group (4 AI): cùng làm một việc ====== */

    "2. Agree on how to split the work, each do your part, read and give feedback, and fix each other's work. Keep messages concise and don't repeat what has already been said.\n" +
    "3. The final result must be written out in full in a message, because the user only reads this conversation.\n" +
    "4. When you believe the task is done well and you agree with the current result, end your message with exactly the phrase “Đã Xong” (Vietnamese for “Done”). Only write it when you are truly satisfied; if something is missing or wrong, keep working and don't write it. The conversation stops only when " + (n === 2 ? "both of you have" : "all " + n + " of you have") + " said “Đã Xong”.\n" +
    "5. Reply in the user's language.";
}
function teamView(conv, kind, k){      /* cuộc trò chuyện nhìn từ phía AI k, gộp các tin cùng vai */
  const out = [];
  conv.msgs.forEach(m => {
    if (m.err || m.role === "note") return;
    let role, content;
    if (m.role === "user"){ role = "user"; content = "[" + t("userTag") + "]: " + m.content; }
    else if (m.who === k){ role = "assistant"; content = m.content; }
    else { role = "user"; content = "[" + sn(m.who) + "]: " + m.content; }
    const last = out[out.length - 1];
    if (last && last.role === role){ last.content += "\n\n" + content; if (m.imgs) last.imgs = (last.imgs || []).concat(m.imgs); if (m.files) last.files = (last.files || []).concat(m.files); }
    else out.push({ role, content, imgs: m.imgs ? [...m.imgs] : undefined, files: m.files ? [...m.files] : undefined });
  });
  return out;
}
async function runTeam(conv, ctl, kind){
  const ks = KS[kind], P = S[kind], grp = kind === "group", MAX = grp ? GROUP_MAX : S.chat.tmax, flag = {}; let n = 0, ok = false;
  for (; n < MAX && !ctl.signal.aborted; n++){
    const k = ks[n % ks.length], T = P[k];
    const m = await turn({ p: T.p, model: T.m, msgs: teamView(conv, kind, k), sys: teamSys(kind, k), label: tname(kind, k), color: PROVIDERS[T.p].color, ctl,
      onSwitch: nm => { T.m = nm; store.set("mc_" + kind, P); renderPicks(kind); lockUI(true); } });
    m.who = k; m.lbl = tname(kind, k); m.col = PROVIDERS[T.p].color;
    conv.msgs.push(m); conv.t = Date.now(); persist();
    if (m.err){ if (!ctl.signal.aborted) notifyDone(t(grp ? "notifGroupErr" : "notifTeamErr"), m.content); return; }
    flag[k] = !m.aborted && DONE.test(m.content.normalize("NFC"));
    if (ks.every(x => flag[x])){ ok = true; break; }
  }
  const nk = ok ? (grp ? "noteDoneG" : "noteDone") : ctl.signal.aborted ? "noteStop" : (grp ? "noteMaxG" : "noteMax");
  const note = { role: "note", nk, np: (ok || ctl.signal.aborted) ? [] : [MAX] };
  conv.msgs.push(note); persist();
  const txt = t(note.nk, ...note.np); bubble("note", txt);
  if (!ctl.signal.aborted) notifyDone(t(grp ? "notifGroup" : "notifTeam"), txt);
}

function setBusy(b){
  S.busy = b; const s = $("send"); s.textContent = b ? t("stop") : t("send"); s.classList.toggle("stop", b);
  lockUI(b);
}
async function send(){
  const ta = $("input"), text = ta.value.trim(), att = S.pending, imgs = att.filter(a => !a.name), files = att.filter(a => a.name);
  if ((!text && !att.length) || S.busy) return;
  const p = S.p, team = isMulti(p);
  if (team){
    const miss = KS[p].filter(k => !keyOK(S[p][k].p));
    if (miss.length){ toast(t("needKeys", [...new Set(miss.map(k => PROVIDERS[S[p][k].p].name))].join(", "))); openSet(); return; }
  } else if (!keyOK(p)){ toast(t("needKey", PROVIDERS[p].name)); openSet(); return; }
  let conv = getConv(p);
  if (!conv){
    const ti = text ? (text.length > 40 ? text.slice(0, 40) + "…" : text) : (files[0] ? files[0].name : t("imageTitle"));
    conv = { id: uid(), title: ti, msgs: [], t: Date.now() };
    S.convs[p].unshift(conv); S.cur[p] = conv.id;
  }
  const um = { role: "user", content: text }; if (imgs.length) um.imgs = imgs; if (files.length) um.files = files;
  conv.msgs.push(um); conv.t = Date.now();
  S.pending = []; renderPrev();
  ta.value = ""; ta.style.height = "auto";
  if (conv.msgs.length === 1) $("log").innerHTML = "";
  bubble("user", text, "", um.imgs, 0, um.files);
  const ctl = new AbortController(); S.abort = ctl; setBusy(true); persist(); renderConvs();
  try {
    if (team) await runTeam(conv, ctl, p);
    else {
      const m = await turn({ p, model: S.model[p], msgs: conv.msgs, sys: "", label: PROVIDERS[p].name, color: PROVIDERS[p].color, ctl,
        onSwitch: nm => { S.model[p] = nm; store.set("mc_model", S.model); if (S.p === p){ renderModels(); lockUI(true); } } });
      conv.msgs.push(m);
      if (!ctl.signal.aborted) notifyDone(t(m.err ? "notifErr" : "notifDone", PROVIDERS[p].name), m.content);
    }
  } finally { setBusy(false); S.abort = null; persist(); ta.focus(); }
}

/* ====== Cài đặt & giao diện ====== */
function openSet(){
  document.querySelectorAll("#keys input").forEach(inp => { inp.value = S.keys[inp.dataset.id] || ""; });
  $("warn").style.display = (store.ok && !S.vaultErr) ? "none" : "block";
  setTheme(S.theme); setUI(S.ui); setTab("web"); syncChat(); $("modal").classList.add("show");
}
function closeSet(){ $("modal").classList.remove("show"); if (S.busy) renderProvs(); else renderAll(); }
function syncTog(){
  const c = document.body.classList.contains("collapsed") && !matchMedia("(max-width:760px)").matches;
  $("tog").textContent = c ? "»" : "«"; $("tog").setAttribute("aria-expanded", String(!c)); $("tog").title = c ? t("togExpand") : t("togCollapse");
}
function toggleSide(){
  if (matchMedia("(max-width:760px)").matches) $("side").classList.toggle("open");
  else store.set("mc_col", document.body.classList.toggle("collapsed"));
  syncTog();
}

/* ====== API key của mọi provider (kể cả provider tùy chỉnh) ====== */
function buildKeys(){
  const box = $("keys"); box.innerHTML = "";
  ids.forEach(i => {
    const l = document.createElement("label"), s = document.createElement("span"), inp = document.createElement("input");
    l.className = "key"; s.textContent = PROVIDERS[i].name + " API key";
    inp.type = $("show").checked ? "text" : "password"; inp.id = "k_" + i; inp.dataset.id = i; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.value = S.keys[i] || ""; inp.placeholder = t("pasteKey", PROVIDERS[i].name);
    inp.addEventListener("input", () => {
      const v = inp.value.trim();
      if (v) S.keys[i] = v; else delete S.keys[i];
      saveKeys().then(() => { $("warn").style.display = (store.ok && !S.vaultErr) ? "none" : "block"; });
    });
    l.append(s, inp); box.appendChild(l);
  });
}
buildKeys();
$("show").onchange = e => document.querySelectorAll("#keys input").forEach(x => { x.type = e.target.checked ? "text" : "password"; });

/* ====== Custom Providers: tạo / sửa / xóa ngay trên giao diện ====== */
let editId = null;
function parseModels(s){ return [...new Set(s.split(/[\n,;]+/).map(x => x.trim()).filter(Boolean))]; }
function openProv(id){
  if (busyGuard()) return;
  editId = id; const c = id ? customs.find(x => x.id === id) : null;
  $("pmt").textContent = t(id ? "pTitleEdit" : "pTitleNew");
  $("p_name").value = c ? c.name : ""; $("p_url").value = c ? c.url : "";
  $("p_fmt").value = c ? c.fmt : "openai"; dd($("p_fmt"));
  $("p_key").value = c ? (S.keys[id] || "") : ""; $("p_models").value = c ? c.models.join("\n") : "";
  $("p_err").hidden = true; $("p_del").hidden = !id; $("pmodal").classList.add("show"); $("p_name").focus();
}
function closeProv(){ $("pmodal").classList.remove("show"); ddCloseAll(); }
async function saveProv(){
  const name = $("p_name").value.trim(), url = $("p_url").value.trim(), fmt = $("p_fmt").value, key = $("p_key").value.trim(), models = parseModels($("p_models").value);
  const bad = k => { $("p_err").textContent = t(k); $("p_err").hidden = false; };
  if (!name) return bad("pErrName");
  let okUrl = false; try { const u = new URL(url); okUrl = u.protocol === "http:" || u.protocol === "https:"; } catch(e){}
  if (!okUrl) return bad("pErrUrl");
  if (!models.length) return bad("pErrModels");
  let c = editId ? customs.find(x => x.id === editId) : null;
  if (!c){ c = { id: "c_" + uid(), color: CPAL[customs.length % CPAL.length] }; customs.push(c); }
  Object.assign(c, { name, url, fmt, models });
  regCustom(c); refreshIds(); fixTeam(); store.set("mc_team", S.team); store.set("mc_group", S.group);
  if (key) S.keys[c.id] = key; else delete S.keys[c.id];
  store.set("mc_custom", customs); await saveKeys();
  closeProv(); buildKeys(); S.p = c.id; store.set("mc_p", c.id); renderAll(); toast(t("pSaved"));
}
function delProv(){
  if (!editId || !confirm(t("pDelConfirm", PROVIDERS[editId].name))) return;
  const id = editId;
  delete PROVIDERS[id]; customs = customs.filter(x => x.id !== id);
  delete S.keys[id]; delete S.convs[id]; delete S.cur[id]; delete S.model[id];
  refreshIds(); fixTeam(); store.set("mc_team", S.team); store.set("mc_group", S.group); store.set("mc_custom", customs); store.set("mc_model", S.model); persist(); saveKeys();
  if (S.p === id){ S.p = ids[0]; store.set("mc_p", S.p); }
  closeProv(); buildKeys(); renderAll(); toast(t("pDeleted"));
}
$("p_save").onclick = saveProv; $("p_del").onclick = delProv; $("p_cancel").onclick = closeProv;
$("pmodal").onclick = e => { if (e.target.id === "pmodal") closeProv(); };

document.querySelectorAll("#themeSeg button").forEach(b => b.onclick = () => setTheme(b.dataset.t));
document.querySelectorAll("#uiSeg button").forEach(b => b.onclick = () => setUI(b.dataset.u));
$("apply").onclick = async () => { await saveKeys(); closeSet(); toast(S.vaultErr ? t("saveFail") : t("saved")); };
$("close").onclick = closeSet;
$("openSet").onclick = openSet;
$("modal").onclick = e => { if (e.target.id === "modal") closeSet(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("plusmenu").hidden) closePlus();
  else if ($("fsmodal").classList.contains("show")) closeFs();
  else if ($("pmodal").classList.contains("show")) closeProv(); else if ($("modal").classList.contains("show")) closeSet();
});
$("fs_close").onclick = closeFs; $("fsmodal").onclick = e => { if (e.target.id === "fsmodal") closeFs(); };
$("model").onchange = e => { S.model[S.p] = e.target.value; store.set("mc_model", S.model); updateTools(); };
$("newc").onclick = () => { if (busyGuard()) return; S.cur[S.p] = null; persist(); renderConvs(); renderLog(); $("input").focus(); };
$("tog").onclick = toggleSide;
const saveChat = () => store.set("mc_chat", S.chat);
document.querySelectorAll("#setTabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("c_notify").onchange = async e => {
  const el = e.target;
  if (el.checked){
    if (!("Notification" in window)){ el.checked = false; toast(t("notifUnsupported")); return; }
    let perm = Notification.permission;
    if (perm === "default"){ try { perm = await Notification.requestPermission(); } catch(x){ perm = "denied"; } }
    if (perm !== "granted"){ el.checked = false; S.chat.notify = false; saveChat(); $("notiWarn").hidden = false; return; }
    try { new Notification("MultiChat", { body: t("notifOn"), icon: "icon.png" }); } catch(x){}
  }
  S.chat.notify = el.checked; saveChat(); if (el.checked) $("notiWarn").hidden = true;
};
$("c_auto").onchange = e => { S.chat.auto = e.target.checked; $("c_n_row").hidden = !S.chat.auto; saveChat(); };
bindNum("n", "c_n", "c_n_num", 1, 20); bindNum("tmax", "c_tmax", "c_tmax_num", 2, 100);
$("c_saver").onchange = e => { S.chat.saver = e.target.checked; saveChat(); };
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => setLang(b.dataset.l));
document.addEventListener("click", () => ddCloseAll());
$("menu").onclick = e => { e.stopPropagation(); toggleSide(); };
window.addEventListener("resize", syncTog);
document.querySelector("main").addEventListener("click", () => $("side").classList.remove("open"));
$("attach").onclick = () => $("file").click();
function closePlus(){ $("plusmenu").hidden = true; $("plus").setAttribute("aria-expanded", "false"); }
$("plus").onclick = e => { e.stopPropagation(); const was = $("plusmenu").hidden; closePlus(); if (was){ $("plusmenu").hidden = false; $("plus").setAttribute("aria-expanded", "true"); } };
document.addEventListener("click", closePlus);
$("sl").onclick = () => { S.slides = !S.slides; store.set("mc_slides", S.slides); updateTools(); };
$("spill").onclick = () => { S.search = false; store.set("mc_search", false); updateTools(); };
$("slpill").onclick = () => { S.slides = false; store.set("mc_slides", false); updateTools(); };
document.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files.length){ e.preventDefault(); addFiles([...e.dataTransfer.files]); } });
$("file").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("srch").onclick = () => { S.search = !S.search; store.set("mc_search", S.search); updateTools(); };
document.querySelectorAll("#eff button").forEach(b => b.onclick = () => { S.eff = b.dataset.e; store.set("mc_eff", S.eff); updateTools(); });
$("form").onsubmit = e => { e.preventDefault(); if (S.busy){ if (S.abort) S.abort.abort(); return; } send(); };
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px"; });
$("input").addEventListener("paste", e => { const f = [...(e.clipboardData ? e.clipboardData.files : [])]; if (f.length){ e.preventDefault(); addFiles(f); } });

if (store.get("mc_col", false)) document.body.classList.add("collapsed");
setTheme(S.theme); setUI(S.ui); dd($("c_n")); dd($("c_tmax")); dd($("p_fmt")); applyLang();
renderAll();
loadKeys().then(renderAll);
</script>
