<style>
:root{--bg:#f3f5f9;--panel:#fff;--side:#e9edf5;--ink:#172033;--mute:#6b7690;--line:#d9dfec;--user:#1f3a8a;--userink:#fff;--bot:#fff;--code:#eef1f8;--acc:#1f3a8a;--shadow:0 6px 24px rgba(23,32,51,.08)}
[data-theme=dark]{--bg:#0f1420;--panel:#171e2e;--side:#121827;--ink:#e6eaf4;--mute:#8f9ab3;--line:#26304a;--user:#3b5bdb;--userink:#fff;--bot:#1b2336;--code:#0e1422;--acc:#7c94ff;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}

aside{width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:8px;flex-shrink:0;transition:transform .2s,width .2s}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.5px;padding:4px 8px}
.logo span{color:var(--acc)}

.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.prov small{margin-left:auto;font-weight:500;color:var(--mute);font-size:12px}
.lh{font-size:13px;color:var(--mute);font-weight:600;padding:10px 10px 2px}
#convs{min-height:0;overflow-y:auto;flex:0 1 auto}
.cv{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.cv:hover{background:var(--panel)}

.cv .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .x{opacity:0;border:0;background:none;color:var(--mute);padding:0 4px;font-size:18px;line-height:1}
.cv:hover .x,.cv:focus-within .x,.cv.on .x{opacity:1}
.cv .x:hover{color:#d9534f}
.none{padding:6px 10px;color:var(--mute);font-size:13px}
.sp{flex:1 0 0}
.sbtn{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.sbtn:hover{border-color:var(--acc)}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#menu,#newc{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-weight:600}
#menu:hover,#newc:hover{border-color:var(--acc)}
#title{font-weight:700;font-size:17px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
header select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);max-width:46vw;min-width:0}
#log{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:min(760px,88%);padding:12px 16px;border-radius:16px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--userink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{border-color:#d9534f;color:#d9534f}
.msg a{color:var(--acc)}
.msg pre{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.msg code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--code);padding:1px 5px;border-radius:4px}
.msg pre code{padding:0;background:none}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs img{max-height:160px;max-width:100%;border-radius:10px;display:block}
.imgn{margin-top:6px;font-size:13px;opacity:.85}
.who{font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:600}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:360px;line-height:1.6}

footer{background:var(--panel);border-top:1px solid var(--line)}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.seg2 button.on{background:var(--acc);color:var(--bg)}
form{display:flex;gap:10px;padding:10px 20px 18px}
textarea{flex:1;resize:none;max-height:180px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);line-height:1.5}
#send{padding:0 20px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font-weight:700}
#send:disabled{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.box{background:var(--panel);width:min(520px,100%);max-height:92vh;overflow-y:auto;border-radius:16px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.box h2{margin:0 0 4px;font-size:20px}
.box h3{margin:20px 0 8px;font-size:15px}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.seg button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}
.key{display:block;margin-bottom:10px;font-size:13px;font-weight:600}
.key input{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:400}
.row{display:flex;gap:10px;align-items:center;margin-top:16px}
.row .grow{flex:1}
.row button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.row .pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#warn{color:#d9534f;display:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:761px){
body.collapsed aside{width:68px;padding:16px 10px}
body.collapsed .logo,body.collapsed .nm,body.collapsed .prov small,body.collapsed .lbl,body.collapsed .lh,body.collapsed #convs{display:none}
body.collapsed .top{justify-content:center;padding-bottom:12px}

}
@media(max-width:760px){

aside.open{transform:none;box-shadow:var(--shadow)}
.msg{max-width:94%}
.t{display:none}
.effg{margin-left:0}
}

html[data-ui=new] header{margin:12px 16px 0;border:1px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

  <div class="top">
    <div class="logo">Multi<span>Chat</span></div>
    <button id="tog" data-ia="togAria">«</button>
  </div>
  <div id="provs"></div>
  <div class="lh" data-i="convs"></div>
  <div id="convs"></div>
  <div class="sp"></div>
  <button class="sbtn" id="openSet" data-it="settings">⚙<span class="lbl" data-i="settings"></span></button>
</aside>

<main>
  <header>
    <button id="menu" data-ia="menuT" data-it="menuT">☰</button>
    <div id="title"></div>
    <div class="hr">
      <button id="newc" data-it="newcT">＋<span class="t" data-i="newcT"></span></button>
      <select id="model" data-ia="pickModel"></select>
    </div>
  </header>
  <div id="teambar" hidden></div>
  <div id="log"></div>
  <footer>
    <div id="prev"></div>
    <div class="tools">
      <button type="button" class="chip" id="attach" data-it="attachT" data-i="attach"></button>
      <button type="button" class="chip" id="srch" data-i="search"></button>
      <div class="effg" data-it="effT">
        <span>Effort</span>
        <div class="seg2" id="eff">
          <button type="button" data-e="auto">Auto</button>
          <button type="button" data-e="low">Low</button>
          <button type="button" data-e="medium">Medium</button>
          <button type="button" data-e="high">High</button>
        </div>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <form id="form">
      <textarea id="input" rows="1" data-ip="ph"></textarea>
      <button id="send" type="submit"></button>
    </form>
  </footer>
</main>

<div class="modal" id="modal">
  <div class="box" role="dialog" aria-labelledby="mt">
    <h2 id="mt" data-i="settings"></h2>
    <div class="seg tabs" id="setTabs" role="tablist" data-ia="tabsAria">
      <button type="button" role="tab" data-tab="web" class="on">Web</button>
      <button type="button" role="tab" data-tab="chat">Chat</button>
    </div>
    <div id="tab-web">
    <h3 data-i="hColor"></h3>
    <div class="seg" id="themeSeg">
      <button data-t="light" data-i="light"></button>
      <button data-t="dark" data-i="dark"></button>
    </div>
    <h3 data-i="hUI"></h3>
    <div class="seg" id="uiSeg">
      <button data-u="classic">Classic</button>
      <button data-u="new">New</button>
    </div>
    <p class="hint" style="margin-top:8px" data-i="uiHint"></p>
    <h3 data-i="hLang"></h3>
    <div class="seg" id="langSeg">
      <button type="button" data-l="en">English</button>
      <button type="button" data-l="vi">Tiếng Việt</button>
    </div>
    <h3>API Key</h3>
    <p class="hint" data-i="keysHint"></p>
    <p class="hint" id="warn" data-i="warn"></p>
    <div id="keys"></div>
    <label class="hint"><input type="checkbox" id="show"> <span data-i="showKeys"></span></label>
    </div>
    <div id="tab-chat" hidden>
      <h3 data-i="hNotif"></h3>
      <label class="sw"><input type="checkbox" id="c_notify"><span class="sl"></span><span class="st"><b data-i="notifT"></b><small data-i="notifS"></small></span></label>
      <p class="hint bad" id="notiWarn" data-i="notiWarn" hidden></p>
      <h3 data-i="hAuto"></h3>
      <label class="sw"><input type="checkbox" id="c_auto"><span class="sl"></span><span class="st"><b data-i="autoT"></b><small data-i="autoS"></small></span></label>
      <div class="opt sub" id="c_n_row" hidden><span class="ot" data-i="autoN"></span><select id="c_n" data-ia="autoN"><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
      <h3 data-i="hTeam"></h3>
      <div class="opt"><span class="ot"><b data-i="tmaxT"></b><small data-i="tmaxS"></small></span><select id="c_tmax" data-ia="tmaxT"><option>4</option><option>8</option><option>12</option><option>16</option><option>20</option><option>24</option></select></div>
      <h3 data-i="hSaver"></h3>
      <label class="sw"><input type="checkbox" id="c_saver"><span class="sl"></span><span class="st"><b data-i="saverT"></b><small data-i="saverS"></small></span></label>
    </div>
    <div class="row">
      <span class="grow"></span>
      <button id="close" data-i="close"></button>
      <button id="apply" class="pri" data-i="apply"></button>
    </div>
  </div>
</div>

function t(k, ...a){ const v = (I18N[S.lang] && I18N[S.lang][k] !== undefined) ? I18N[S.lang][k] : I18N.en[k]; return typeof v === "function" ? v(...a) : v; }
function applyLang(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll("[data-ip]").forEach(e => { e.placeholder = t(e.dataset.ip); });
  document.querySelectorAll("[data-it]").forEach(e => { e.title = t(e.dataset.it); });
  document.querySelectorAll("[data-ia]").forEach(e => { e.setAttribute("aria-label", t(e.dataset.ia)); });
  ids.forEach(i => { $("k_" + i).placeholder = t("pasteKey", PROVIDERS[i].name); });
  $("send").textContent = S.busy ? t("stop") : t("send");
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.l === S.lang));
  document.querySelectorAll("select.has-dd").forEach(dd);
  syncTog(); updateTools();
}
function setLang(l){
  S.lang = l; store.set("mc_lang", l); applyLang();
  if (S.busy) renderProvs(); else renderAll();
}

/* ====== Mã hóa API key: AES-GCM 256, khóa không-xuất-được lưu trong IndexedDB ====== */
const Vault = {
  async key(){
    if (this.k) return this.k;
    const db = await new Promise((res, rej) => { const r = indexedDB.open("mc_vault", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    let k = await new Promise((res, rej) => { const q = db.transaction("k").objectStore("k").get("main"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    if (!k){
      k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      await new Promise((res, rej) => { const tx = db.transaction("k", "readwrite"); tx.objectStore("k").put(k, "main"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    }
    return this.k = k;
  },
  async enc(obj){
    const k = await this.key(), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj))));
    const b = new Uint8Array(12 + ct.length); b.set(iv); b.set(ct, 12);
    return btoa(String.fromCharCode(...b));
  },
  async dec(s){
    const k = await this.key(), b = Uint8Array.from(atob(s), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, k, b.slice(12))));
  }
};

function ddClose(w){ w.classList.remove("open", "up"); w.querySelector(".dd-menu").hidden = true; w.querySelector(".dd-btn").setAttribute("aria-expanded", "false"); }
function ddCloseAll(except){ document.querySelectorAll(".dd.open").forEach(x => { if (x !== except) ddClose(x); }); }
function ddAct(m, el){ m.querySelectorAll(".act").forEach(x => x.classList.remove("act")); if (el){ el.classList.add("act"); el.scrollIntoView({ block: "nearest" }); } }
function ddOpen(w){
  ddCloseAll(w); w.classList.add("open");
  const m = w.querySelector(".dd-menu"); m.hidden = false; w.querySelector(".dd-btn").setAttribute("aria-expanded", "true");
  const r = w.getBoundingClientRect(), bx = w.closest(".box"), lo = bx ? bx.getBoundingClientRect() : { top: 0, bottom: innerHeight }, mh = m.offsetHeight + 12;
  if (lo.bottom - r.bottom < mh && r.top - lo.top > mh) w.classList.add("up");
  ddAct(m, m.querySelector(".sel") || m.firstChild);
}
function ddKey(e, w){
  const open = w.classList.contains("open"), m = w.querySelector(".dd-menu"), os = [...m.children], i = os.findIndex(x => x.classList.contains("act"));
  if (!open){ if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)){ e.preventDefault(); ddOpen(w); } return; }
  if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); ddClose(w); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); ddAct(m, os[Math.min(i + 1, os.length - 1)]); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); ddAct(m, os[Math.max(i - 1, 0)]); }
  else if (e.key === "Home"){ e.preventDefault(); ddAct(m, os[0]); }
  else if (e.key === "End"){ e.preventDefault(); ddAct(m, os[os.length - 1]); }
  else if (e.key === "Enter" || e.key === " "){ e.preventDefault(); if (os[i]) os[i].click(); }
  else if (e.key === "Tab") ddClose(w);
}

function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res({ m: "image/jpeg", d: c.toDataURL("image/jpeg", .85).split(",")[1] });
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

const DONE = /(đã|da)\s*xong/i;

async function readSSE(res, fn){
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;){
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0){
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
      if (!data || data === "[DONE]") continue;
      let j; try { j = JSON.parse(data); } catch(e){ continue; }
      fn(j);
    }
  }
}
function splitThink(raw){      /* một số model (qwen, deepseek…) trả suy nghĩ trong thẻ <think> */
  const m = raw.match(/<think>([\s\S]*?)(<\/think>|$)/);
  return m ? { think: m[1], text: raw.replace(m[0], "").replace(/^\s+/, "") } : { think: "", text: raw };
}

  const { p, model, key, eff, search, sys, signal, on } = o, ms = o.msgs.filter(m => !m.err);
  const headers = { "Content-Type": "application/json" };
  let url, body, ev, fb = null, raw = "", rs = "", aborted = false;
  const src = [], addSrc = (u, t) => { if (u && !src.some(s => s.u === u)) src.push({ u, t: t || u }); };
  const emit = () => { const s = splitThink(raw); on(s.text, (rs + s.think).trim()); };
  const T = d => { raw += d; emit(); }, R = d => { rs += d; emit(); };
  if (BASE[p]){
    headers.Authorization = "Bearer " + key;
    if (search && (p === "chatgpt" || p === "grok")){            /* ChatGPT & Grok: Responses API + web_search */
      url = BASE[p] + "/responses";
      body = { model, input: ms.map(toResp), tools: [{ type: "web_search" }], stream: true };
      if (sys) body.instructions = sys;
      if (eff !== "auto" && p === "chatgpt" && REASON.test(model)) body.reasoning = { effort: eff };
      fb = j => j.output_text || (j.output || []).filter(x => x.type === "message").flatMap(x => x.content || []).map(c => c.text || "").join("");
      ev = j => {
        const ty = j.type || "";
        if (ty === "response.output_text.delta") T(j.delta);
        else if (/reasoning(_summary)?_text\.delta$/.test(ty)) R(j.delta);
        else if (ty === "response.output_text.annotation.added" && j.annotation && j.annotation.url) addSrc(j.annotation.url, j.annotation.title);
        else if (ty === "error") throw new Error(j.message || (j.error && j.error.message) || t("err"));
        else if (ty === "response.failed") throw new Error((j.response && j.response.error && j.response.error.message) || t("failed"));
      };
    } else {
      url = BASE[p] + "/chat/completions";
      body = { model, messages: [...(sys ? [{ role: "system", content: sys }] : []), ...ms.map(toOAI)], stream: true };
      if (eff !== "auto"){
        if (p === "chatgpt" && REASON.test(model)) body.reasoning_effort = eff;
        if (p === "grok" && /grok-3-mini/.test(model)) body.reasoning_effort = eff === "high" ? "high" : "low";
        if (p === "groq" && /gpt-oss/.test(model)) body.reasoning_effort = eff;
        if (p === "openrouter") body.reasoning = { effort: eff };
      }
      if (search && p === "groq" && /gpt-oss/.test(model)) body.tools = [{ type: "browser_search" }];
      if (search && p === "openrouter") body.plugins = [{ id: "web" }];
      fb = j => (j.choices[0].message.content || "");
      ev = j => {
        if (j.error) throw new Error(j.error.message || t("err"));
        const c = j.choices && j.choices[0]; if (!c) return;
        const d = c.delta || {}, rr = d.reasoning_content || (typeof d.reasoning === "string" ? d.reasoning : "");
        if (rr) R(rr);
        if (d.content) T(d.content);
        (d.annotations || []).forEach(a => a.url_citation && addSrc(a.url_citation.url, a.url_citation.title));
      };
    }
  } else if (p === "claude"){
    url = "https://api.anthropic.com/v1/messages";
    headers["x-api-key"] = key; headers["anthropic-version"] = "2023-06-01"; headers["anthropic-dangerous-direct-browser-access"] = "true";
    const bud = { low: 1024, medium: 4096, high: 12000 }[eff];
    body = { model, max_tokens: (bud || 0) + 4096, messages: ms.map(toClaude), stream: true };
    if (sys) body.system = sys;
    if (bud) body.thinking = { type: "enabled", budget_tokens: bud };
    if (search) body.tools = [{ type: "web_search_20250305", name: "web_search", max_uses: 5 }];
    ev = j => {
      if (j.type === "content_block_delta"){ const d = j.delta || {}; if (d.type === "text_delta") T(d.text); else if (d.type === "thinking_delta") R(d.thinking); }
      else if (j.type === "content_block_start" && j.content_block && Array.isArray(j.content_block.content)) j.content_block.content.forEach(x => x.url && addSrc(x.url, x.title));
      else if (j.type === "error") throw new Error((j.error && j.error.message) || t("err"));
    };
  } else {
    url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse";
    headers["x-goog-api-key"] = key;
    body = { contents: ms.map(m => ({ role: m.role === "user" ? "user" : "model", parts: [...(m.imgs || []).map(i => ({ inline_data: { mime_type: i.m, data: i.d } })), ...(m.content ? [{ text: m.content }] : [])] })) };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };
    const tc = {};
    if (/gemini-(2\.5|3|4)/.test(model)) tc.includeThoughts = true;
    if (eff !== "auto"){
      if (/gemini-(3|4)/.test(model)) tc.thinkingLevel = (/pro/.test(model) && eff === "medium") ? "high" : eff;
      else if (/gemini-2\.5/.test(model)) tc.thinkingBudget = { low: 1024, medium: 8192, high: 24576 }[eff];
    }
    if (Object.keys(tc).length) body.generationConfig = { thinkingConfig: tc };
    if (search) body.tools = [{ google_search: {} }];
    ev = j => {
      if (j.error) throw new Error(j.error.message || t("err"));
      const c = j.candidates && j.candidates[0]; if (!c) return;
      ((c.content && c.content.parts) || []).forEach(x => { if (x.text) (x.thought ? R(x.text) : T(x.text)); });
      ((c.groundingMetadata || {}).groundingChunks || []).forEach(x => x.web && addSrc(x.web.uri, x.web.title));
    };
  }
  const go = () => fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal });
  const fail = async r => { const j = await r.json().catch(() => ({})), e = Array.isArray(j) ? j[0] : j; return new Error((e && e.error && (e.error.message || e.error)) || (t("err") + " " + r.status)); };
  try {
    let r = await go();
    if (!r.ok){
      const er = await fail(r);
      if (!fb || !/stream/i.test(er.message)) throw er;          /* model không cho stream: chuyển sang không-stream */
      delete body.stream; r = await go();
      if (!r.ok) throw await fail(r);
      T(fb(await r.json()));
    } else await readSSE(r, ev);
  } catch(e){ if (e.name === "AbortError") aborted = true; else throw e; }
  const s = splitThink(raw);
  let text = s.text;
  if (src.length) text += "\n\n**" + t("sources") + "**\n" + src.map(x => "- " + x.t + ": " + x.u).join("\n");
  return { text, think: (rs + s.think).trim(), aborted };
}

const AUTO_HOPS = 3;                       /* tự đổi: tối đa bấy nhiêu model cho mỗi yêu cầu */
const FATAL = /incorrect api key|invalid.{0,12}api.?key|api key not valid|unauthori[sz]ed|authentication/i;
const sleep = (ms, sig) => new Promise(res => { const t = setTimeout(res, ms); if (sig) sig.addEventListener("abort", () => { clearTimeout(t); res(); }, { once: true }); });
/* Chế độ tiết kiệm token: chỉ dẫn ẩn (system prompt) gửi kèm mỗi yêu cầu khi bật */
const SAVER = "Token-saving mode is ON. Think only as much as needed and keep your reasoning brief. Answer as concisely as possible: no preamble, no restating the question, no repetition, no unnecessary caveats. Do not cut content the user explicitly asked for (code, documents, requested details); just avoid padding. Reply in the user's language.";

/* Một lượt trả lời: hiện bong bóng, đếm giờ, hiện phần suy nghĩ; nếu bật "Tự đổi model" thì thử lại rồi đổi sang model kế bên khi lỗi */
async function turn(o){
  const { p, msgs, label, color, ctl } = o, cfg = S.chat, list = PROVIDERS[p].models, N = cfg.auto ? cfg.n : 1;
  const sys = [o.sys, cfg.saver ? SAVER : ""].filter(Boolean).join("\n\n");
  let model = o.model; const b = botBubble(label, color);
  let t0 = performance.now(), ttft = null, info = "";
  const tick = setInterval(() => b.meta("⏱ " + fmtT(performance.now() - t0) + (ttft == null ? t("waiting") : "") + info), 100);
  let r, err, tries = 0, hops = 0;
  for (;;){
    err = null; t0 = performance.now(); ttft = null;
    try {
      r = await callAPI({ p, model, msgs, key: S.keys[p], eff: S.eff, search: S.search && canSearch(p, model), sys, signal: ctl.signal,
        on: (tx, th) => { if (ttft == null && (tx || th)) ttft = performance.now() - t0; b.set(tx, th); } });
    } catch(e){ err = e; }
    if (!err || ctl.signal.aborted || !cfg.auto || FATAL.test(String(err.message))) break;
    tries++; b.set("", "");
    if (tries < N){ info = t("retry", tries, N); await sleep(800 * tries, ctl.signal); continue; }
    if (hops >= AUTO_HOPS || list.length < 2) break;
    model = list[(list.indexOf(model) + 1) % list.length]; hops++; tries = 0;
    info = t("switching", model);
  }
  clearInterval(tick);
  const m = { role: "assistant", content: "", ms: Math.round(performance.now() - t0), ttft: ttft == null ? null : Math.round(ttft) };
  if (err){
    m.err = true; m.content = t("errPrefix") + (err.message === "Failed to fetch" ? t("netErr") : String(err.message));
    if (cfg.auto && (hops > 0 || tries > 1)) m.content += "\n\n" + t("retried", hops > 0);
    b.el.classList.add("err");
  } else {
    m.content = r.text || (r.aborted ? "" : t("emptyReply"));
    if (r.think) m.think = r.think;
    if (r.aborted){ m.aborted = true; m.content = (m.content ? m.content + "\n\n" : "") + t("stopped"); }
    if (model !== o.model){
      m.sw = o.model + " → " + model;
      if (o.onSwitch) o.onSwitch(model);
      toast(t("switched", m.sw));
    }
  }
  b.flush(m.content, m.think); b.meta(metaText(m));
  return m;
}

/* ====== Team: 2 AI cùng làm một việc ====== */
const sn = k => k === "a" ? "AI-1" : "AI-2";
const tname = k => sn(k) + " · " + PROVIDERS[S.team[k].p].name + " · " + S.team[k].m;
function teamSys(me, other){
  const A = S.team[me], B = S.team[other];
  if (S.lang === "vi") return "Bạn là " + sn(me) + " (" + PROVIDERS[A.p].name + ", model " + A.m + "). Bạn đang làm việc nhóm với " + sn(other) + " (" + PROVIDERS[B.p].name + ", model " + B.m + ") để cùng hoàn thành một nhiệm vụ do người dùng giao. Hai bạn nhắn qua lại theo lượt, mỗi lượt một người. Tin của đồng đội và của người dùng sẽ hiện dạng [Tên]: nội dung (đừng tự viết tiền tố này trong tin của bạn).\n" +
    "Quy tắc:\n" +
    "1. Trong tin nhắn đầu tiên của bạn, hãy tự giới thiệu ngắn gọn (bạn là AI nào, model gì, điểm mạnh) để đồng đội biết bạn, rồi vào việc luôn.\n" +
    "2. Thống nhất cách chia việc, mỗi người làm phần của mình, đọc và góp ý, sửa cho nhau. Giữ tin nhắn gọn, không lặp lại điều đã nói.\n" +
    "3. Kết quả cuối cùng phải được viết đầy đủ trong tin nhắn, vì người dùng chỉ đọc cuộc trò chuyện này.\n" +
    "4. Khi bạn thấy nhiệm vụ đã hoàn thành tốt và đồng ý với kết quả hiện tại, hãy kết thúc tin nhắn bằng đúng cụm “Đã Xong”. Chỉ viết cụm này khi bạn thật sự hài lòng; còn thiếu hoặc còn sai thì tiếp tục làm và không viết cụm này. Cuộc trò chuyện chỉ dừng khi cả hai cùng nói “Đã Xong”.\n" +
    "5. Trả lời bằng ngôn ngữ của người dùng.";
  return "You are " + sn(me) + " (" + PROVIDERS[A.p].name + ", model " + A.m + "). You are working in a team with " + sn(other) + " (" + PROVIDERS[B.p].name + ", model " + B.m + ") to complete a task given by the user. You take turns messaging, one at a time. Messages from your teammate and the user appear as [Name]: content (don't write this prefix yourself).\n" +
    "Rules:\n" +
    "1. In your first message, briefly introduce yourself (which AI and model you are, your strengths) so your teammate gets to know you, then get to work right away.\n" +
    "2. Agree on how to split the work, each do your part, read and give feedback, and fix each other's work. Keep messages concise and don't repeat what has already been said.\n" +
    "3. The final result must be written out in full in a message, because the user only reads this conversation.\n" +
    "4. When you believe the task is done well and you agree with the current result, end your message with exactly the phrase “Đã Xong” (Vietnamese for “Done”). Only write it when you are truly satisfied; if something is missing or wrong, keep working and don't write it. The conversation stops only when both of you have said “Đã Xong”.\n" +
    "5. Reply in the user's language.";
}
function teamView(conv, k){      /* cuộc trò chuyện nhìn từ phía AI k, gộp các tin cùng vai */
  const out = [];
  conv.msgs.forEach(m => {
    if (m.err || m.role === "note") return;
    let role, content;
    if (m.role === "user"){ role = "user"; content = "[" + t("userTag") + "]: " + m.content; }
    else if (m.who === k){ role = "assistant"; content = m.content; }
    else { role = "user"; content = "[" + sn(m.who) + "]: " + m.content; }
    const last = out[out.length - 1];
    if (last && last.role === role){ last.content += "\n\n" + content; if (m.imgs) last.imgs = (last.imgs || []).concat(m.imgs); }
    else out.push({ role, content, imgs: m.imgs ? [...m.imgs] : undefined });
  });
  return out;
}
async function runTeam(conv, ctl){
  const MAX = S.chat.tmax, flag = { a: false, b: false }; let n = 0, ok = false;
  for (; n < MAX && !ctl.signal.aborted; n++){
    const k = n % 2 ? "b" : "a", o = k === "a" ? "b" : "a", T = S.team[k];
    const m = await turn({ p: T.p, model: T.m, msgs: teamView(conv, k), sys: teamSys(k, o), label: tname(k), color: PROVIDERS[T.p].color, ctl,
      onSwitch: nm => { T.m = nm; store.set("mc_team", S.team); renderTeam(); lockUI(true); } });
    m.who = k; m.lbl = tname(k); m.col = PROVIDERS[T.p].color;
    conv.msgs.push(m); conv.t = Date.now(); persist();
    if (m.err){ if (!ctl.signal.aborted) notifyDone(t("notifTeamErr"), m.content); return; }
    flag[k] = !m.aborted && DONE.test(m.content.normalize("NFC"));
    if (flag.a && flag.b){ ok = true; break; }
  }
  const note = { role: "note", nk: ok ? "noteDone" : ctl.signal.aborted ? "noteStop" : "noteMax", np: ok || ctl.signal.aborted ? [] : [MAX] };
  conv.msgs.push(note); persist();
  const txt = t(note.nk, ...note.np); bubble("note", txt);
  if (!ctl.signal.aborted) notifyDone(t("notifTeam"), txt);
}

function setBusy(b){
  S.busy = b; const s = $("send"); s.textContent = b ? t("stop") : t("send"); s.classList.toggle("stop", b);
  lockUI(b);
}
async function send(){
  const ta = $("input"), text = ta.value.trim(), imgs = S.pending;
  if ((!text && !imgs.length) || S.busy) return;
  const p = S.p, team = p === "team";
  if (team){
    const { a, b } = S.team;
    if (!S.keys[a.p] || !S.keys[b.p]){ toast(t("needKeys", PROVIDERS[a.p].name, PROVIDERS[b.p].name)); openSet(); return; }
  } else if (!S.keys[p]){ toast(t("needKey", PROVIDERS[p].name)); openSet(); return; }
  let conv = getConv(p);
  if (!conv){
    const ti = text ? (text.length > 40 ? text.slice(0, 40) + "…" : text) : t("imageTitle");
    conv = { id: uid(), title: ti, msgs: [], t: Date.now() };
    S.convs[p].unshift(conv); S.cur[p] = conv.id;
  }
  const um = { role: "user", content: text }; if (imgs.length) um.imgs = imgs;
  conv.msgs.push(um); conv.t = Date.now();
  S.pending = []; renderPrev();
  ta.value = ""; ta.style.height = "auto";
  if (conv.msgs.length === 1) $("log").innerHTML = "";
  bubble("user", text, "", um.imgs);
  const ctl = new AbortController(); S.abort = ctl; setBusy(true); persist(); renderConvs();
  try {
    if (team) await runTeam(conv, ctl);
    else {
      const m = await turn({ p, model: S.model[p], msgs: conv.msgs, sys: "", label: PROVIDERS[p].name, color: PROVIDERS[p].color, ctl,
        onSwitch: nm => { S.model[p] = nm; store.set("mc_model", S.model); if (S.p === p){ renderModels(); lockUI(true); } } });
      conv.msgs.push(m);
      if (!ctl.signal.aborted) notifyDone(t(m.err ? "notifErr" : "notifDone", PROVIDERS[p].name), m.content);
    }
  } finally { setBusy(false); S.abort = null; persist(); ta.focus(); }
}

/* ====== Cài đặt & giao diện ====== */
function openSet(){
  ids.forEach(i => { $("k_" + i).value = S.keys[i] || ""; });
  $("warn").style.display = (store.ok && !S.vaultErr) ? "none" : "block";
  setTheme(S.theme); setUI(S.ui); setTab("web"); syncChat(); $("modal").classList.add("show");
}
function closeSet(){ $("modal").classList.remove("show"); if (S.busy) renderProvs(); else renderAll(); }
function syncTog(){
  const c = document.body.classList.contains("collapsed") && !matchMedia("(max-width:760px)").matches;
  $("tog").textContent = c ? "»" : "«"; $("tog").setAttribute("aria-expanded", String(!c)); $("tog").title = c ? t("togExpand") : t("togCollapse");
}
function toggleSide(){
  if (matchMedia("(max-width:760px)").matches) $("side").classList.toggle("open");
  else store.set("mc_col", document.body.classList.toggle("collapsed"));
  syncTog();
}

$("keys").innerHTML = ids.map(i => '<label class="key">' + PROVIDERS[i].name + ' API key<input type="password" id="k_' + i + '" placeholder="" autocomplete="off" spellcheck="false"></label>').join("");
ids.forEach(i => $("k_" + i).addEventListener("input", () => {
  const v = $("k_" + i).value.trim();
  if (v) S.keys[i] = v; else delete S.keys[i];
  saveKeys().then(() => { $("warn").style.display = (store.ok && !S.vaultErr) ? "none" : "block"; });
}));
$("show").onchange = e => ids.forEach(i => { $("k_" + i).type = e.target.checked ? "text" : "password"; });
document.querySelectorAll("#themeSeg button").forEach(b => b.onclick = () => setTheme(b.dataset.t));
document.querySelectorAll("#uiSeg button").forEach(b => b.onclick = () => setUI(b.dataset.u));
$("apply").onclick = async () => { await saveKeys(); closeSet(); toast(S.vaultErr ? t("saveFail") : t("saved")); };
$("close").onclick = closeSet;
$("openSet").onclick = openSet;
$("modal").onclick = e => { if (e.target.id === "modal") closeSet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").classList.contains("show")) closeSet(); });
$("model").onchange = e => { S.model[S.p] = e.target.value; store.set("mc_model", S.model); updateTools(); };
$("newc").onclick = () => { if (busyGuard()) return; S.cur[S.p] = null; persist(); renderConvs(); renderLog(); $("input").focus(); };
$("tog").onclick = toggleSide;
const saveChat = () => store.set("mc_chat", S.chat);
document.querySelectorAll("#setTabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("c_notify").onchange = async e => {
  const el = e.target;
  if (el.checked){
    if (!("Notification" in window)){ el.checked = false; toast(t("notifUnsupported")); return; }
    let perm = Notification.permission;
    if (perm === "default"){ try { perm = await Notification.requestPermission(); } catch(x){ perm = "denied"; } }
    if (perm !== "granted"){ el.checked = false; S.chat.notify = false; saveChat(); $("notiWarn").hidden = false; return; }
    try { new Notification("MultiChat", { body: t("notifOn") }); } catch(x){}
  }
  S.chat.notify = el.checked; saveChat(); if (el.checked) $("notiWarn").hidden = true;
};
$("c_auto").onchange = e => { S.chat.auto = e.target.checked; $("c_n_row").hidden = !S.chat.auto; saveChat(); };
$("c_n").onchange = e => { S.chat.n = +e.target.value; saveChat(); };
$("c_tmax").onchange = e => { S.chat.tmax = +e.target.value; saveChat(); };
$("c_saver").onchange = e => { S.chat.saver = e.target.checked; saveChat(); };
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => setLang(b.dataset.l));
document.addEventListener("click", () => ddCloseAll());
$("menu").onclick = e => { e.stopPropagation(); toggleSide(); };
window.addEventListener("resize", syncTog);
document.querySelector("main").addEventListener("click", () => $("side").classList.remove("open"));
$("attach").onclick = () => $("file").click();
$("file").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("srch").onclick = () => { S.search = !S.search; store.set("mc_search", S.search); updateTools(); };
document.querySelectorAll("#eff button").forEach(b => b.onclick = () => { S.eff = b.dataset.e; store.set("mc_eff", S.eff); updateTools(); });
$("form").onsubmit = e => { e.preventDefault(); if (S.busy){ if (S.abort) S.abort.abort(); return; } send(); };
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px"; });
$("input").addEventListener("paste", e => { const f = [...(e.clipboardData ? e.clipboardData.files : [])].filter(x => x.type.startsWith("image/")); if (f.length){ e.preventDefault(); addFiles(f); } });

if (store.get("mc_col", false)) document.body.classList.add("collapsed");
setTheme(S.theme); setUI(S.ui); dd($("c_n")); dd($("c_tmax")); applyLang();
renderAll();
loadKeys().then(renderAll);
</script>
